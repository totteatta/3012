<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PDF閲覧ページ</title>
</head>
<body>

    <h1>PDFリスト</h1>

    <ul>
        <li><a href="3.pdf" target="pdf-frame">3.pdf を表示</a></li>
        <li><a href="12.pdf" target="pdf-frame">12.pdf を表示</a></li>
    </ul>

    <hr>

    <iframe name="pdf-frame" src="1.pdf" width="100%" height="800px">
        PDFを表示できないブラウザです。上のリンクからダウンロードして閲覧してください。
    </iframe>

</body>
</html>
