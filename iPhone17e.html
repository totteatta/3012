<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>経過時間＆コストカウンター</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007aff;
            --apple-green: #34c759;
            --apple-purple: #af52de;
            --apple-orange: #ff9500; /* Apple Pencil用に追加 */
            --shadow: 0 10px 20px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .toggle-container {
            display: flex;
            background-color: #eef2f7;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .toggle-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            color: #666;
        }

        .toggle-btn.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 2px 4px rgba(0,122,255,0.2);
        }

        .dashboard {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            box-sizing: border-box;
            border-top: 5px solid var(--primary-color);
        }

        /* 各カードのアクセントカラー */
        .card.airpods { border-top-color: var(--apple-green); }
        .card.ipadmini { border-top-color: var(--apple-purple); }
        .card.applepencil { border-top-color: var(--apple-orange); } /* 追加 */

        h1 {
            font-size: 1.3rem;
            color: #222;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .start-date {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
        }

        .counter-display {
            margin-bottom: 20px;
        }

        .value {
            font-size: 2.1rem;
            font-weight: 800;
            color: #111;
            line-height: 1.1;
        }

        .unit {
            font-size: 1.1rem;
            font-weight: 600;
            margin-left: 4px;
            color: #555;
        }

        .sub-value {
            font-size: 0.85rem;
            color: #888;
            margin-top: 6px;
        }

        hr {
            border: none;
            border-top: 1px solid #f0f0f0;
            margin: 20px 0;
        }

        .cost-display h2 {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin: 0 0 8px 0;
        }

        .cost-amount {
            font-size: 2rem;
            font-weight: 700;
            color: #ff3b30;
        }
    </style>
</head>
<body>

<div class="toggle-container">
    <button class="toggle-btn active" id="day-mode-btn" onclick="setMode('day')">日モード</button>
    <button class="toggle-btn" id="hour-mode-btn" onclick="setMode('hour')">時間モード</button>
</div>

<div class="dashboard">
    <div class="card">
        <h1>iPhone 17e</h1>
        <div class="start-date">開始日: 2026年4月2日</div>
        
        <div class="counter-display">
            <div class="value" id="main-counter-1">0<span class="unit">日</span></div>
            <div class="sub-value" id="sub-counter-1">（または 0時間）</div>
        </div>
        <hr>
        <div class="cost-display">
            <h2 id="cost-title-1">99,800円の換算</h2>
            <div class="cost-amount" id="cost-value-1">¥0</div>
        </div>
    </div>

    <div class="card airpods">
        <h1>AirPods 2</h1>
        <div class="start-date">購入日: 2022年2月5日</div>
        
        <div class="counter-display">
            <div class="value" id="main-counter-2">0<span class="unit">日</span></div>
            <div class="sub-value" id="sub-counter-2">（または 0時間）</div>
        </div>
        <hr>
        <div class="cost-display">
            <h2 id="cost-title-2">19,800円の換算</h2>
            <div class="cost-amount" id="cost-value-2">¥0</div>
        </div>
    </div>

    <div class="card ipadmini">
        <h1>iPad mini 6</h1>
        <div class="start-date">購入日: 2022年7月14日</div>
        
        <div class="counter-display">
            <div class="value" id="main-counter-5">0<span class="unit">日</span></div>
            <div class="sub-value" id="sub-counter-5">（または 0時間）</div>
        </div>
        <hr>
        <div class="cost-display">
            <h2 id="cost-title-5">72,800円の換算</h2>
            <div class="cost-amount" id="cost-value-5">¥0</div>
        </div>
    </div>

    <div class="card applepencil">
        <h1>Apple Pencil（第2世代）</h1>
        <div class="start-date">購入日: 2022年7月14日</div>
        
        <div class="counter-display">
            <div class="value" id="main-counter-6">0<span class="unit">日</span></div>
            <div class="sub-value" id="sub-counter-6">（または 0時間）</div>
        </div>
        <hr>
        <div class="cost-display">
            <h2 id="cost-title-6">19,880円の換算</h2>
            <div class="cost-amount" id="cost-value-6">¥0</div>
        </div>
    </div>
</div>

<script>
    // データ定義（Apple Pencilを末尾に追加）
    const targets = [
        { id: 1, name: "99,800円", amount: 99800, date: new Date('2026-04-02T00:00:00') },
        { id: 2, name: "19,800円", amount: 19800, date: new Date('2022-02-05T00:00:00') },
        { id: 5, name: "72,800円", amount: 72800, date: new Date('2022-07-14T00:00:00') },
        { id: 6, name: "19,880円", amount: 19880, date: new Date('2022-07-14T00:00:00') }
    ];

    let currentMode = 'day'; 

    function updateCounters() {
        const now = new Date();

        targets.forEach(target => {
            const diffMs = now - target.date; 
            const diffHoursTotal = diffMs / (1000 * 60 * 60);
            const diffDaysTotal = diffHoursTotal / 24;

            const mainCounter = document.getElementById(`main-counter-${target.id}`);
            const subCounter = document.getElementById(`sub-counter-${target.id}`);
            const costTitle = document.getElementById(`cost-title-${target.id}`);
            const costValue = document.getElementById(`cost-value-${target.id}`);

            if (diffMs < 0) {
                mainCounter.innerHTML = `---`;
                costValue.innerText = `¥---`;
                return;
            }

            if (currentMode === 'day') {
                mainCounter.innerHTML = `${diffDaysTotal.toFixed(2)}<span class="unit">日</span>`;
                subCounter.innerText = `（総時間: ${Math.floor(diffHoursTotal).toLocaleString()}時間）`;
                costTitle.innerText = `${target.name}の 1日あたり`;
                
                const costPerDay = totalCostCalc(target.amount, diffDaysTotal);
                costValue.innerText = `¥${costPerDay.toFixed(2)}`;
            } else {
                mainCounter.innerHTML = `${diffHoursTotal.toFixed(1)}<span class="unit">時間</span>`;
                subCounter.innerText = `（総日数: ${diffDaysTotal.toFixed(1)}日）`;
                costTitle.innerText = `${target.name}の 1時間あたり`;
                
                const costPerHour = totalCostCalc(target.amount, diffHoursTotal);
                costValue.innerText = `¥${costPerHour.toFixed(4)}`; 
            }
        });
    }

    function totalCostCalc(amount, divisor) {
        return divisor > 0 ? (amount / divisor) : amount;
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('day-mode-btn').classList.toggle('active', mode === 'day');
        document.getElementById('hour-mode-btn').classList.toggle('active', mode === 'hour');
        updateCounters();
    }

    // 1秒ごとに自動更新
    setInterval(updateCounters, 1000);
    updateCounters();
</script>

</body>
</html>
