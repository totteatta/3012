<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100分制時計 & 24時間時計</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-sizing: border-box;
    }

    .clock-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid #334155;
    }

    .clock-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
    }

    .clock-display {
      font-size: 4.5rem;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 3px;
    }

    /* 上：100分時計 (シアン色) */
    .decimal-clock {
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    /* 下：24時間時計 (エメラルドグリーン色) */
    .standard-clock {
      color: #34d399;
      text-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
    }

    .clock-sub {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 上：100分制時計 -->
    <div class="clock-card">
      <div class="clock-title">100-MINUTE DECIMAL CLOCK</div>
      <div id="decimalClock" class="clock-display decimal-clock">00:00:00</div>
      <div class="clock-sub">1時間 = 100分 / 1日 = 14時間40分</div>
    </div>

    <!-- 下：24時間時計 -->
    <div class="clock-card">
      <div class="clock-title">STANDARD 24-HOUR CLOCK</div>
      <div id="standardClock" class="clock-display standard-clock">00:00:00</div>
      <div class="clock-sub">1時間 = 60分 / 1日 = 24時間00分</div>
    </div>
  </div>

  <script>
    function updateClocks() {
      const now = new Date();
      
      const realHours = now.getHours();
      const realMinutes = now.getMinutes();
      const realSeconds = now.getSeconds();

      // --- 1. 100分制時計の計算 ---
      const totalRealSeconds = (realHours * 3600) + (realMinutes * 60) + realSeconds;

      const decimalHours = Math.floor(totalRealSeconds / 6000);
      const remainingSecondsAfterHours = totalRealSeconds % 6000;
      
      const decimalMinutes = Math.floor(remainingSecondsAfterHours / 60);
      const decimalSeconds = remainingSecondsAfterHours % 60;

      const dH = String(decimalHours).padStart(2, '0');
      const dM = String(decimalMinutes).padStart(2, '0');
      const dS = String(decimalSeconds).padStart(2, '0');
      document.getElementById('decimalClock').textContent = `${dH}:${dM}:${dS}`;

      // --- 2. 24時間時計の計算 ---
      const sH = String(realHours).padStart(2, '0');
      const sM = String(realMinutes).padStart(2, '0');
      const sS = String(realSeconds).padStart(2, '0');
      document.getElementById('standardClock').textContent = `${sH}:${sM}:${sS}`;
    }

    // 1秒毎に両方の時計を同期更新
    setInterval(updateClocks, 1000);
    updateClocks();
  </script>

</body>
</html>
