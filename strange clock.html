<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100分制時計 & 1日48時間時計</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-sizing: border-box;
    }

    .clock-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid #334155;
    }

    .clock-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
    }

    .clock-display {
      font-size: 4.5rem;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 3px;
    }

    /* 上：100分時計 (シアン色) */
    .decimal-clock {
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    /* 下：1日48時間時計 (パープル色) */
    .clock-48h {
      color: #c084fc;
      text-shadow: 0 0 15px rgba(192, 132, 252, 0.3);
    }

    .clock-sub {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 上：100分制時計 -->
    <div class="clock-card">
      <div class="clock-title">100-MINUTE DECIMAL CLOCK</div>
      <div id="decimalClock" class="clock-display decimal-clock">00:00:00</div>
      <div class="clock-sub">1時間 = 100分 / 1日 = 14時間40分</div>
    </div>

    <!-- 下：1日48時間時計 -->
    <div class="clock-card">
      <div class="clock-title">48-HOUR DAY CLOCK (2x SPEED)</div>
      <div id="clock48" class="clock-display clock-48h">00:00:00</div>
      <div class="clock-sub">1時間 = 現実の30分 / 00:00:00 〜 47:59:59</div>
    </div>
  </div>

  <script>
    function updateClocks() {
      const now = new Date();
      
      const realHours = now.getHours();
      const realMinutes = now.getMinutes();
      const realSeconds = now.getSeconds();

      // 今日の経過秒数 (0 〜 86399秒)
      const totalRealSeconds = (realHours * 3600) + (realMinutes * 60) + realSeconds;

      // --- 1. 100分制時計の計算 ---
      const decimalHours = Math.floor(totalRealSeconds / 6000);
      const remainingDecSec = totalRealSeconds % 6000;
      const decimalMinutes = Math.floor(remainingDecSec / 60);
      const decimalSeconds = remainingDecSec % 60;

      const dH = String(decimalHours).padStart(2, '0');
      const dM = String(decimalMinutes).padStart(2, '0');
      const dS = String(decimalSeconds).padStart(2, '0');
      document.getElementById('decimalClock').textContent = `${dH}:${dM}:${dS}`;

      // --- 2. 1日48時間時計の計算 ---
      // 現実の1秒で「48時間時計」の2秒が進む（2倍速）
      const total48Seconds = totalRealSeconds * 2;

      const hours48 = Math.floor(total48Seconds / 3600);             // 0 〜 47
      const minutes48 = Math.floor((total48Seconds % 3600) / 60);    // 0 〜 59
      const seconds48 = total48Seconds % 60;                         // 0 〜 59

      const h48 = String(hours48).padStart(2, '0');
      const m48 = String(minutes48).padStart(2, '0');
      const s48 = String(seconds48).padStart(2, '0');
      document.getElementById('clock48').textContent = `${h48}:${m48}:${s48}`;
    }

    // 1秒毎に更新
    setInterval(updateClocks, 1000);
    updateClocks();
  </script>

</body>
</html>
